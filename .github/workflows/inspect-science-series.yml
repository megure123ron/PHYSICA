name: Inspect SCIENCE SERIES Icons

on:
  push:
    branches:
      - inspect-science-series-zip
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract ZIP
        run: |
          set -euo pipefail
          mkdir extracted
          unzip -q SCIENCE-SERIES-v1.2-web.zip -d extracted

      - name: Inspect logo rendering
        run: |
          python3 - <<'PY'
          from pathlib import Path

          root = Path("extracted")
          terms = [
              "brand-mark",
              "organic",
              "polymerize",
              "symbol:",
              "symbol}",
              "symbol)",
              "CHEMICA",
              "毎ターン提案する",
              "BGM ",
          ]

          for path in sorted(root.rglob("*.js")):
              source = path.read_text(encoding="utf-8", errors="ignore")
              found = False

              for term in terms:
                  start = 0
                  count = 0
                  while count < 5:
                      pos = source.find(term, start)
                      if pos < 0:
                          break
                      if not found:
                          print(f"\n===== {path} =====")
                          found = True
                      print(f"\n--- {term} ---")
                      print(source[max(0,pos-700):pos+1100])
                      start = pos + len(term)
                      count += 1

          print("\n===== INSPECTION COMPLETE =====")
          PY
