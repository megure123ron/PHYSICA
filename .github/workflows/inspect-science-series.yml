
name: Inspect SCIENCE SERIES Source

on:
  push:
    branches:
      - inspect-science-series-zip
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract ZIP
        run: |
          set -euo pipefail
          mkdir extracted
          unzip -q SCIENCE-SERIES-v1.2-web.zip -d extracted

      - name: Inspect game source
        run: |
          python3 - <<'PY'
          from pathlib import Path

          for path in Path("extracted").rglob("*.js"):
              s = path.read_text(encoding="utf-8", errors="ignore")

              print(f"\n\n========== FILE: {path} ==========")

              # Icon renderer
              p = s.find("function vt({field")
              if p >= 0:
                  print("\n--- ICON RENDERER ---")
                  print(s[p:p+14000])
              else:
                  print("\nIcon renderer not found")

              # CHEMICA icon metadata
              p = s.find('symbol:"organic"')
              if p >= 0:
                  print("\n--- CHEMICA METADATA ---")
                  print(s[max(0,p-1000):p+1000])

              # Battle proposal toggle
              p = s.find("毎ターン提案する")
              if p >= 0:
                  print("\n--- PROPOSAL TOGGLE ---")
                  print(s[max(0,p-1200):p+1200])

              # Battle settings row
              p = s.find("battle-settings-row")
              if p >= 0:
                  print("\n--- BATTLE SETTINGS ---")
                  print(s[max(0,p-500):p+1800])

          print("\n========== INSPECTION COMPLETE ==========")
          PY
