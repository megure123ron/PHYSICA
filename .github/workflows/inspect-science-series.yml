
name: Inspect SCIENCE SERIES BGM

on:
  push:
    branches:
      - inspect-science-series-zip

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Find BGM files
        shell: bash
        run: |
          set -euo pipefail
          mkdir extracted
          unzip -q SCIENCE-SERIES-v1.2-web.zip -d extracted

          python3 - <<'PY'
          from pathlib import Path

          root = Path("extracted")
          exts = {".html", ".js", ".css", ".json", ".svg"}
          total = 0

          for p in sorted(root.rglob("*")):
              if not p.is_file() or p.suffix.lower() not in exts:
                  continue
              try:
                  s = p.read_text(encoding="utf-8")
              except Exception:
                  continue

              count = s.lower().count("bgm")
              if count:
                  print(f"BGM_COUNT={count} | FILE={p}")
                  total += count

          print(f"TOTAL_BGM_MATCHES={total}")
          PY
