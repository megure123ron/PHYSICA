
name: Inspect SCIENCE SERIES Header CSS

on:
  push:
    branches:
      - inspect-science-series-zip
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract ZIP
        run: |
          set -euo pipefail
          mkdir extracted
          unzip -q SCIENCE-SERIES-v1.2-web.zip -d extracted

      - name: Inspect header and icon styles
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          root = Path("extracted")

          for path in root.rglob("*.js"):
              s = path.read_text(encoding="utf-8", errors="ignore")
              if "brand-mark" not in s:
                  continue

              print(f"\n===== HEADER: {path} =====")

              for term in ["brand-mark", "className:\"brand\"", "symbol:\"organic\""]:
                  p = s.find(term)
                  if p >= 0:
                      print(f"\n--- {term} ---")
                      print(s[max(0,p-1000):p+1800])

          for path in root.rglob("*.css"):
              s = path.read_text(encoding="utf-8", errors="ignore")
              matches = list(re.finditer(
                  r"[^{}]*(?:brand-mark|brand\b|header|svg)[^{}]*\{[^{}]*\}",
                  s
              ))
              if matches:
                  print(f"\n===== CSS: {path} =====")
                  for m in matches:
                      print(m.group(0)[:1200])

          print("\n===== HEADER INSPECTION COMPLETE =====")
          PY
