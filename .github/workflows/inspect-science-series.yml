name: Inspect SCIENCE SERIES Icon Renderer

on:
  push:
    branches:
      - inspect-science-series-zip
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract ZIP
        run: |
          set -euo pipefail
          mkdir extracted
          unzip -q SCIENCE-SERIES-v1.2-web.zip -d extracted

      - name: Find icon renderer
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          for path in Path("extracted").rglob("*.js"):
              s = path.read_text(encoding="utf-8", errors="ignore")
              patterns = [
                  r"function\s+vt\s*\(",
                  r"\bvt\s*=\s*\(",
                  r"\bvt\s*=\s*function",
                  r"\bvt\s*=",
              ]

              matches = []
              for pattern in patterns:
                  matches.extend(list(re.finditer(pattern, s)))

              if matches:
                  print(f"\n===== {path} =====")
                  seen = set()
                  for m in matches[:8]:
                      start = max(0, m.start() - 500)
                      end = min(len(s), m.start() + 3500)
                      if start not in seen:
                          print("\n--- icon renderer ---")
                          print(s[start:end])
                          seen.add(start)

          print("\n===== COMPLETE =====")
          PY
