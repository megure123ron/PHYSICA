
name: Inspect SCIENCE SERIES BGM

on:
  push:
    branches:
      - inspect-science-series-zip
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract SCIENCE SERIES
        shell: bash
        run: |
          set -euo pipefail
          ZIP_FILE="SCIENCE-SERIES-v1.2-web.zip"
          test -f "$ZIP_FILE"
          mkdir extracted
          unzip -q "$ZIP_FILE" -d extracted

      - name: Find BGM references
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          root = Path("extracted")
          exts = {".html", ".js", ".css", ".json", ".svg"}
          total = 0

          for path in sorted(root.rglob("*")):
              if not path.is_file() or path.suffix.lower() not in exts:
                  continue
              try:
                  source = path.read_text(encoding="utf-8")
              except (UnicodeDecodeError, OSError):
                  continue

              lower = source.lower()
              count = lower.count("bgm")
              if not count:
                  continue

              print(f"\n=== FILE: {path} | BGM MATCHES: {count} ===")
              start = 0
              shown = 0
              while shown < 12:
                  index = lower.find("bgm", start)
                  if index < 0:
                      break
                  left = max(0, index - 220)
                  right = min(len(source), index + 300)
                  print(source[left:right].replace("\n", " ")[:520])
                  start = index + 3
                  shown += 1
              total += count

          print(f"\nTOTAL_BGM_MATCHES={total}")
          PY
