
name: Deploy SCIENCE SERIES

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Extract SCIENCE SERIES
        run: |
          ZIP_FILE="SCIENCE-SERIES-v1.2-web.zip"

          if [ ! -f "$ZIP_FILE" ]; then
            echo "ERROR: ZIP file not found: $ZIP_FILE"
            exit 1
          fi

          mkdir extracted
          unzip -q "$ZIP_FILE" -d extracted

          mkdir public

          SOURCE="extracted"

          DIR_COUNT=$(find extracted -mindepth 1 -maxdepth 1 -type d | wc -l)
          FILE_COUNT=$(find extracted -mindepth 1 -maxdepth 1 -type f | wc -l)

          if [ "$DIR_COUNT" -eq 1 ] && [ "$FILE_COUNT" -eq 0 ]; then
            SOURCE=$(find extracted -mindepth 1 -maxdepth 1 -type d)
          fi

          cp -a "$SOURCE"/. public/

          echo "=== Published HTML files ==="
          find public -name "index.html" -print

          if ! find public -name "index.html" | grep -q .; then
            echo "ERROR: No index.html found"
            exit 1
          fi

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
